services:

  # Conteneur MongoDB
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_pw
    secrets:
      - mongo_root_user
      - mongo_root_pw
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s      # vérifie toutes les 5 secondes
      timeout: 5s       # abandon si pas de réponse en 5s
      retries: 10       # 10 tentatives avant de déclarer unhealthy
      start_period: 10s # attend 10s avant de commencer les checks

  # Conteneur qui initialise les utilisateurs puis exécute la migration
  migration:
    build: .
    container_name: migration
    depends_on:
      mongodb:
        condition: service_healthy  # attend que le healthcheck soit OK
    secrets:
      - mongo_root_user
      - mongo_root_pw
      - mongo_db
      - mongo_user_admin_id
      - mongo_user_admin_pw
      - mongo_user_visitor_id
      - mongo_user_visitor_pw
    volumes:
      - ./data:/app/data
    command: >
      sh -c "python init_mongo.py && python migrate.py"

volumes:
  mongodb_data:

secrets:
  mongo_root_user:
    file: ./secrets/mongo_root_user.txt
  mongo_root_pw:
    file: ./secrets/mongo_root_pw.txt
  mongo_db:
    file: ./secrets/mongo_db.txt
  mongo_user_admin_id:
    file: ./secrets/mongo_user_admin_id.txt
  mongo_user_admin_pw:
    file: ./secrets/mongo_user_admin_pw.txt
  mongo_user_visitor_id:
    file: ./secrets/mongo_user_visitor_id.txt
  mongo_user_visitor_pw:
    file: ./secrets/mongo_user_visitor_pw.txt